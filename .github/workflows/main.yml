name: Execute Operational AI Data Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to run this data process manually anytime

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Ingest Repository Code
      uses: actions/checkout@v4

    - name: Initialize Enterprise Python Sandbox Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Provision Core Data Engineering Packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Live Core Analytics Processing
      run: |
        python src/pipeline.py
